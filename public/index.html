<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zorvia Dialer</title>
<meta name="theme-color" content="#0A0D17">
<link rel="icon" href="/brand/zorvia-logo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="login">
  <div class="box">
    <img class="logo" src="/brand/zorvia-logo.png" alt="Zorvia">
    <h1>Sign in</h1>
    <p class="sub">Zorvia Dialer — UK collections console</p>
    <label class="f"><span>Email</span><input id="li-email" type="email" autocomplete="username" placeholder="you@company.co.uk"></label>
    <label class="f"><span>Password</span><input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••••"></label>
    <div id="li-msg"></div>
    <button id="li-go" style="width:100%">Sign in</button>
    <p class="foot label">Access is logged</p>
  </div>
</div>

<div id="app">
  <nav>
    <div class="brand">
      <img src="/brand/zorvia-logo-mark.png" alt="" onerror="this.src='/brand/zorvia-logo.png'">
      <div class="txt"><b>Zorvia</b><span>Dialer</span></div>
    </div>

    <div class="group label">Operations</div>
    <a href="#/dashboard"><span class="ic">◧</span>Dashboard</a>
    <a href="#/campaigns"><span class="ic">◈</span>Campaigns</a>
    <a href="#/live"><span class="ic">◉</span>Live monitor</a>
    <a href="#/calls"><span class="ic">▤</span>Call history</a>

    <div class="group label">Accounts</div>
    <a href="#/lists"><span class="ic">▦</span>Lead lists</a>
    <a href="#/leads"><span class="ic">▪</span>Leads</a>

    <div class="group label">Configuration</div>
    <a href="#/agents"><span class="ic">◆</span>AI agents</a>
    <a href="#/inbound"><span class="ic">◄</span>Inbound routes</a>
    <a href="#/users"><span class="ic">◎</span>Users</a>
    <a href="#/audit"><span class="ic">≡</span>Audit log</a>
    <a href="#/settings"><span class="ic">⚙</span>Settings</a>
  </nav>

  <main>
    <header class="top">
      <h1 id="page-title">Dashboard</h1>
      <div class="who">
        <div class="avatar" id="avatar"></div>
        <span id="whoami"></span>
        <button class="ghost sm" id="signout">Sign out</button>
      </div>
    </header>
    <div class="strip" id="strip"></div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<dialog id="modal">
  <div class="head" id="modal-head"></div>
  <div class="body" id="modal-body"></div>
  <div class="foot"><button class="ghost" onclick="document.getElementById('modal').close()">Close</button></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
